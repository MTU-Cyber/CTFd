services:
  ctfd:
    build: .
    user: root
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SECRET_KEY=${CTFD_SECRET_KEY:?Set CTFD_SECRET_KEY in .env}
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:${CTFD_DB_PASSWORD:?Set CTFD_DB_PASSWORD in .env}@db/ctfd
      - REDIS_URL=redis://:${CTFD_REDIS_PASSWORD:?Set CTFD_REDIS_PASSWORD in .env}@cache:6379
      - WORKERS=4
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
      - TINY_INSTANCER_AUTH_SECRET=${TINY_INSTANCER_AUTH_SECRET:?Set TINY_INSTANCER_AUTH_SECRET in .env}
      - TINY_INSTANCER_CALLBACK_URL=https://instances.cyberctfhub.ie/auth
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
      - .:/opt/CTFd:ro
      - ../WS26Friendly:/challenges:ro
    depends_on:
      - db
    networks:
        default:
        internal:

#nginx:
#    image: nginx:stable
#    restart: always
#    volumes:
#      - ./conf/nginx/http.conf:/etc/nginx/nginx.conf
#    ports:
#      - 80:80
#    depends_on:
#      - ctfd

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${CTFD_DB_ROOT_PASSWORD:?Set CTFD_DB_ROOT_PASSWORD in .env}
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=${CTFD_DB_PASSWORD:?Set CTFD_DB_PASSWORD in .env}
      - MARIADB_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - .data/mysql:/var/lib/mysql
    networks:
        internal:
    # This command is required to set important mariadb defaults
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]

  cache:
    image: redis:4
    restart: always
    command: ["redis-server", "--requirepass", "${CTFD_REDIS_PASSWORD:?Set CTFD_REDIS_PASSWORD in .env}"]
    volumes:
    - .data/redis:/data
    networks:
        internal:

networks:
    default:
    internal:
        internal: true
